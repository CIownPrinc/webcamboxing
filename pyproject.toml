[project]
name = "webcamboxing-python-quality"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".git",
  ".output",
  ".turbo",
  "dist",
  "node_modules",
  "test-results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
